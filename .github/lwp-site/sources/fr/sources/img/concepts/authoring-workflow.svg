<text x="716" y="421" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f7f4ec">LightWebPres</text>
<text x="716" y="455" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f7f4ec">CLI ou navigateur</text>
<text x="716" y="484" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f7f4ec">Le même exécutable</text>
</g>
<g id="document" data-node="document">
