<text x="50" y="431" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0e2a43">Vous pilotez un agent</text>
<text x="50" y="465" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">Donnez une consigne, relisez</text>
<text x="50" y="494" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">et révisez avec un agent.</text>
</g>
