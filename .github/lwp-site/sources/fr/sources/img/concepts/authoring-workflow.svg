<text x="962" y="484" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">Lire et présenter ;</text>
<text x="962" y="513" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">partager les fichiers.</text>
