<text x="424" y="401" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0e2a43">Fichiers modifiables</text>
<text x="424" y="435" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">Markdown LWP</text>
<text x="424" y="464" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">+ images</text>
<text x="424" y="493" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">series.json</text>
<text x="424" y="522" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">(config. de série)</text>
</g>
