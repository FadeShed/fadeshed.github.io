<text x="50" y="633" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0e2a43">Agent autonome</text>
<text x="50" y="667" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">Une consigne ou une tâche ;</text>
<text x="50" y="696" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">l’agent rédige les sources.</text>
</g>
<text x="32" y="340" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#167d8d">OU</text>
<text x="32" y="542" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#167d8d">OU</text>
