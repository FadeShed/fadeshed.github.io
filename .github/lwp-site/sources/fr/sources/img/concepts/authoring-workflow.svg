<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Des sources au navigateur</title>
<desc id="diagram-desc">Les rôles et les ressources rejoignent le même moteur LightWebPres. Les agents et l’hébergement sont externes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#167d8d"/></marker></defs>
<rect x="0" y="0" width="1200" height="760" rx="0" fill="#f7f4ec" stroke="none" stroke-width="2"/>
<text x="32" y="50" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#0e2a43">Des sources au navigateur</text>
<text x="32" y="86" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">Trois manières de créer.</text>
<text x="32" y="116" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">Les agents sont externes à LightWebPres.</text>
<path data-from="human" data-to="source" data-kind="alternative" d="M 352 232.0 L 380 232.0 L 380 434 L 406 434" fill="none" stroke="#167d8d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="steered-agent" data-to="source" data-kind="alternative" d="M 352 434.0 L 380 434.0 L 380 434 L 406 434" fill="none" stroke="#167d8d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="autonomous-agent" data-to="source" data-kind="alternative" d="M 352 636.0 L 380 636.0 L 380 434 L 406 434" fill="none" stroke="#167d8d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="source" data-to="build" data-kind="resource" d="M 658 434.0 L 698 434.0" fill="none" stroke="#167d8d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="build" data-to="document" data-kind="resource" d="M 908 434.0 L 944 434.0" fill="none" stroke="#167d8d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g id="human" data-node="human">
<rect x="32" y="150" width="320" height="164" rx="14" fill="#ffffff" stroke="#167d8d" stroke-width="2"/>
