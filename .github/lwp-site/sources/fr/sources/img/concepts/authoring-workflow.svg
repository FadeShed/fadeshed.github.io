<text x="50" y="229" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0e2a43">Vous écrivez</text>
<text x="50" y="263" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">Rédigez et révisez</text>
<text x="50" y="292" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">les sources.</text>
</g>
