name: Verify transparent FadeShed mark
on:
  push:
    branches: ["install/fileshed-microsite-assets"]
    paths: [".github/workflows/import-fadeshed-mark.yml"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Restore and store the byte-exact approved image
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os
          from urllib.request import Request, urlopen
          root = 'https://api.github.com/repos/FadeShed/fadeshed.github.io/git/blobs'
          headers = {'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          with urlopen(Request(root+'/9cbd455fef5bf5990dea5ab291317d074625eea9', headers=headers), timeout=30) as response:
              data = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha256(data).hexdigest() == '2d2cf7dae3cb06f29a568a61566d53bfa98ec646e9df106fa434b4d7a9ba9b39'
          # Remove the duplicated 15-byte run introduced in transport.
          assert data[2209:2224].hex() == 'ea7fa5fe57ea7fa5fe57ea7fa5fe57'
          data = data[:2209] + data[2224:]
          assert len(data) == 11510
          assert hashlib.sha256(data).hexdigest() == '0d4b0d2c2c73cf4af54d51afbf24c54c2b2e06a7baab1cc571de29eefbca4fc5'
          payload = json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode()
          with urlopen(Request(root, data=payload, headers=headers, method='POST'), timeout=30) as response:
              result = json.load(response)
          assert result['sha'] == '48b0ac9c9ca8413f97837d948561e68fa7028344'
          print('Verified image stored:', result['sha'])
          PY
