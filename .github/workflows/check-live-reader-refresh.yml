name: Verify deployed minisites
on:
  push:
    branches: [main]
    paths:
      - 'lightwebpres/**'
      - 'fr/lightwebpres/**'
      - 'assets/bilingual-manifest.json'
      - 'assets/minisites.*'
      - 'fr/assets/minisites.*'
      - 'fileshed/**'
      - 'fr/fileshed/**'
      - 'pasteberth/**'
      - 'fr/pasteberth/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-lightwebpres-check
  cancel-in-progress: false
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install isolated checks
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r .github/lwp-site/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -m playwright install --with-deps chromium
      - name: Confirm the actual files served by Pages
        id: served
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,time,urllib.request
          selection=['index.html','usages.html','demarrer.html','apparence.html','concepts/docs/first-page.html','concepts/field-notes/first-page.html','demo/library.html','downloads/publication.html','web/lightwebpres','web/index.html','guide/guide.html','themes.html','llms.txt']
          files=[prefix+'lightwebpres/'+name for prefix in ['', 'fr/'] for name in selection]
          files+=['index.html','fr/index.html','fileshed/index.html','fr/fileshed/index.html','pasteberth/demo.html','fr/pasteberth/demo.html','assets/bilingual-manifest.json','assets/minisites.js','assets/minisites.css']
          out=Path(os.environ['RUNNER_TEMP'])/'qa';out.mkdir(exist_ok=True)
          pending=set(files);results={}
          for attempt in range(24):
              for name in sorted(pending):
                  expected=hashlib.sha256(Path(name).read_bytes()).hexdigest()
                  try:
                      with urllib.request.urlopen('https://fadeshed.github.io/'+name+'?check='+os.environ['GITHUB_SHA'],timeout=25) as response:
                          body=response.read();status=response.status
                      actual=hashlib.sha256(body).hexdigest();results[name]={'path':name,'status':status,'expected':expected,'actual':actual,'match':actual==expected}
                  except Exception as error:results[name]={'path':name,'match':False,'error':str(error)}
              pending={name for name in pending if not results[name]['match']}
              (out/'deployed-bytes.json').write_text(json.dumps(list(results.values()),indent=2)+'\n')
              if not pending:break
              time.sleep(10)
          else:raise RuntimeError('Pages propagation not confirmed')
          PY
      - name: Exercise the deployed pages and browser builder
        id: browser
        run: |
          "$RUNNER_TEMP/venv/bin/python" .github/lwp-site/qa.py . "$RUNNER_TEMP/qa" --base-url https://fadeshed.github.io/
      - name: Record exact publication state
        if: always()
        env:
          SERVED: ${{ steps.served.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          out=Path(os.environ['RUNNER_TEMP'])/'qa';out.mkdir(exist_ok=True)
          tests=json.loads((out/'report.json').read_text()) if (out/'report.json').exists() else {}
          served=json.loads((out/'deployed-bytes.json').read_text()) if (out/'deployed-bytes.json').exists() else []
          proof={'repository':os.environ['GITHUB_REPOSITORY'],'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'checked_at':datetime.now(timezone.utc).isoformat(),'status':'verified' if os.environ['SERVED']=='success' and os.environ['BROWSER']=='success' else 'incomplete','checks':tests.get('checks'),'passed':tests.get('passed'),'served_files':len(served),'served_matches':sum(bool(x.get('match')) for x in served),'scope':'Live Chromium browser journeys; touch emulation, not physical phones. Downloaded standalone HTML is also exercised from the checked-out file.'}
          (out/'verification-state.json').write_text(json.dumps(proof,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('```json\n'+json.dumps(proof,indent=2)+'\n```\n')
          PY
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployed-minisites-qa
          path: ${{ runner.temp }}/qa
          retention-days: 14
          if-no-files-found: warn
