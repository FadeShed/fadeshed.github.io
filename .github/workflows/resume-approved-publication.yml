name: Resume approved publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/resume-approved-publication.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export tracked files only
        run: |
          mkdir -p "$RUNNER_TEMP/resume-evidence"
          git archive --format=tar.gz --output="$RUNNER_TEMP/resume-evidence/repository.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/resume-evidence/commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-resume-snapshot
          path: ${{ runner.temp }}/resume-evidence
          retention-days: 3
