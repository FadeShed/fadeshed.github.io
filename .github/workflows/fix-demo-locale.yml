name: Verify self-contained demo navigation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-demo-locale.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install browser tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/bilingual-venv"
          "$RUNNER_TEMP/bilingual-venv/bin/python" -m pip install beautifulsoup4==4.15.0 playwright==1.62.0
          "$RUNNER_TEMP/bilingual-venv/bin/python" -m playwright install --with-deps chromium
      - name: Inline navigation resources without weakening the demo policy
        run: |
          "$RUNNER_TEMP/bilingual-venv/bin/python" - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,os,shutil
          root=Path('.').resolve();out=Path(os.environ['RUNNER_TEMP'])/'publication'
          for name in ['index.html','index.md','style.css','llms.txt','.nojekyll','assets','fileshed','pasteberth','lightwebpres','fr']:
              src=root/name;dest=out/name;dest.parent.mkdir(parents=True,exist_ok=True)
              if src.is_dir():shutil.copytree(src,dest)
              else:shutil.copyfile(src,dest)
          helper='''from pathlib import Path
          import base64
          from bs4 import BeautifulSoup
          def embed_demo_chrome(output):
              for locale in ["", "fr"]:
                  edition=output/locale
                  path=edition/"pasteberth/demo.html"
                  s=BeautifulSoup(path.read_text(),"html.parser")
                  for node in list(s.select('link[rel="stylesheet"]')):
                      if "assets/minisites.css" in node.get("href",""):
                          style=s.new_tag("style",id="fs-demo-chrome")
                          style.string=(edition/"assets/minisites.css").read_text()
                          node.replace_with(style)
                  for node in list(s.select('script[src]')):
                      if "assets/minisites.js" in node.get("src",""):
                          script=s.new_tag("script",id="fs-demo-navigation")
                          script.string=(edition/"assets/minisites.js").read_text()
                          node.replace_with(script)
                  for image in s.select(".fs-utility img"):
                      image["src"]="data:image/webp;base64,"+base64.b64encode((edition/"assets/fadeshed-mark.webp").read_bytes()).decode()
                  if locale=="fr":
                      for script in s.select("script"):
                          text=script.string or ""
                          if "function tr(v){if(Object.hasOwn(exact,v))" in text:
                              script.string=text.replace("return v\\n", "return v.replace(/^Group: Projects$/,'Groupe : Projets').replace(/^Group: Overview$/,'Groupe : Vue d’ensemble').replace(/^Group: Focus$/,'Groupe : Focus')\\n",1)
                  path.write_text(str(s),encoding="utf-8")
          '''
          # Strip YAML's indentation from the embedded helper's body only.
          helper='\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines())+'\n'
          hp=root/'.github/bilingual/embed_demo_chrome.py';hp.write_text(helper)
          namespace={};exec(compile(helper,str(hp),'exec'),namespace);namespace['embed_demo_chrome'](out)
          bp=root/'.github/bilingual/build.py';text=bp.read_text()
          marker='    manifest={p.relative_to(output).as_posix():'
          if marker not in text:raise RuntimeError('Missing publication manifest hook')
          text=text.replace(marker,'    from embed_demo_chrome import embed_demo_chrome\n    embed_demo_chrome(output)\n'+marker,1);bp.write_text(text)
          qp=root/'.github/bilingual/qa.py';text=qp.read_text()
          marker="                check(f'Demo loads {locale}',frame.locator('.zone').count()>0)"
          if marker not in text:raise RuntimeError('Missing demo check hook')
          text=text.replace(marker,marker+'''\n                check(f'Embedded navigation hidden {locale}',not frame.locator('.fs-utility').is_visible())
                          check(f'Demo images decoded {locale}',frame.locator('img').evaluate_all("nodes=>nodes.filter(e=>e.getBoundingClientRect().width>0).every(e=>e.complete&&e.naturalWidth>0)"))'''.replace('\n                          ','\n                '),1)
          qp.write_text(text)
          manifest=out/'assets/bilingual-manifest.json';data=json.loads(manifest.read_text())
          for name in ['pasteberth/demo.html','fr/pasteberth/demo.html']:data['files'][name]=hashlib.sha256((out/name).read_bytes()).hexdigest()
          manifest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          # Future builds use reviewable checked-in sources, not old bootstrap overlays.
          workflow=root/'.github/workflows/publish-bilingual.yml'
          wf=workflow.read_text();start=wf.index('on:');end=wf.index('permissions:',start)
          wf=wf[:start]+'on:\n  workflow_dispatch:\n'+wf[end:]
          start=wf.index('      - name: Verify and unpack bilingual build sources');end=wf.index('      - name: Install isolated browser test tooling',start)
          wf=wf[:start]+wf[end:];workflow.write_text(wf)
          prep=root/'.github/bilingual/prepare_commit.py';text=prep.read_text()
          marker="    print('Uploading',len(files),'public/source files',flush=True)"
          if marker not in text:raise RuntimeError('Missing commit preparation hook')
          text=text.replace(marker,"    files['.github/workflows/publish-bilingual.yml']=root/'.github/workflows/publish-bilingual.yml'\n"+marker,1);prep.write_text(text)
          print('Demo resources embedded; CSP retained; source and QA updated.')
          PY
      - name: Rerun bilingual routes, resources, demos and builder
        run: |
          "$RUNNER_TEMP/bilingual-venv/bin/python" .github/bilingual/qa.py "$RUNNER_TEMP/publication" "$RUNNER_TEMP/qa"
      - name: Prepare the verified correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/bilingual/prepare_commit.py
      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bilingual-demo-qa
          path: ${{ runner.temp }}/qa
          retention-days: 3
          if-no-files-found: warn
