name: Export current public source snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/export-reader-refresh.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked public files without credentials or untracked inputs
        run: |
          mkdir -p "$RUNNER_TEMP/snapshot"
          git archive --format=tar --output="$RUNNER_TEMP/snapshot/website.tar" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/snapshot/COMMIT"
          sha256sum "$RUNNER_TEMP/snapshot/website.tar" > "$RUNNER_TEMP/snapshot/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-public-source
          path: ${{ runner.temp }}/snapshot
          retention-days: 3
          if-no-files-found: error
